<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini OpenRouter UI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0f12;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 15px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1f2937;
    }

    h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }

    .key-bar { display: flex; gap: 8px; }

    input, select, button {
      background: #161b22;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: inherit;
    }

    input:focus, select:focus { outline: 1px solid #00ffcc; }

    button {
      cursor: pointer;
      background: #21262d;
      color: #00ffcc;
      border-color: #30363d;
      transition: 0.2s;
    }

    button:hover { background: #30363d; }

    #terminal-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #050508;
      border: 1px solid #161b22;
      border-radius: 4px;
      padding: 10px;
      margin: 15px 0;
      overflow: hidden;
    }

    #terminal {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .line { line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
    .user { color: #58a6ff; }
    .bot { color: #7ee787; }
    .sys { color: #8b949e; font-style: italic; }
    .error { color: #f85149; }

    .input-bar { display: flex; gap: 10px; }
    .input-bar input { flex: 1; }
  </style>
</head>
<body>

  <header>
    <h1>Gemini Terminal</h1>
    <div class="key-bar">
      <select id="modelSelect">
        <option value="google/gemini-2.0-flash-001">Gemini 2.0 Flash</option>
        <option value="google/gemini-1.5-flash">Gemini 1.5 Flash</option>
        <option value="google/gemini-1.5-pro">Gemini 1.5 Pro</option>
        <option value="google/gemini-2.0-pro-exp-02-05:free">Gemini 2.0 Pro Exp (Free)</option>
        <option value="google/gemini-2.0-flash-lite-preview-02-05:free">Gemini 2.0 Flash Lite (Free)</option>
      </select>
      <input type="password" id="apiKeyInput" placeholder="Enter sk-or-v1- key..." />
      <button onclick="saveApiKey()">SAVE KEY</button>
    </div>
  </header>

  <div id="terminal-container">
    <div id="terminal"></div>
  </div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Type prompt here... (or /clear)" onkeydown="if(event.key==='Enter') handleSend()" />
    <button onclick="handleSend()">SEND</button>
  </div>

  <script>
    const HARDCODED_KEY = "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";
    const terminal = document.getElementById('terminal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const userInput = document.getElementById('userInput');
    const modelSelect = document.getElementById('modelSelect');

    window.addEventListener('DOMContentLoaded', () => {
      autoFillKey();
      printLine('[OPENROUTER GEMINI ENGINE ONLINE]', 'sys');
      printLine(`Active Model Target: ${modelSelect.value}`, 'sys');
    });

    function autoFillKey() {
      const savedKey = localStorage.getItem('openrouter_key');
      if (savedKey) {
        apiKeyInput.value = savedKey;
      } else {
        apiKeyInput.value = HARDCODED_KEY;
        localStorage.setItem('openrouter_key', HARDCODED_KEY);
      }
    }

    function saveApiKey() {
      const key = apiKeyInput.value.trim();
      if (key) {
        localStorage.setItem('openrouter_key', key);
        printLine('OpenRouter key saved to storage.', 'sys');
      } else {
        localStorage.removeItem('openrouter_key');
        printLine('Key cleared.', 'sys');
      }
    }

    function printLine(text, type = 'sys') {
      const el = document.createElement('div');
      el.className = `line ${type}`;
      el.innerText = text;
      terminal.appendChild(el);
      terminal.scrollTop = terminal.scrollHeight;
      return el;
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      if (text === '/clear') {
        terminal.innerHTML = '';
        userInput.value = '';
        return;
      }

      printLine(`$ ${text}`, 'user');
      userInput.value = '';

      await sendOpenRouterPrompt(text);
    }

    async function sendOpenRouterPrompt(promptText) {
      let apiKey = localStorage.getItem('openrouter_key') || apiKeyInput.value.trim() || HARDCODED_KEY;
      const selectedModel = modelSelect.value;

      if (!apiKey) {
        printLine('Error: No OpenRouter API key found.', 'error');
        return;
      }

      const loader = printLine(`thinking via ${selectedModel}...`, 'sys');

      try {
        const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${apiKey.trim()}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: selectedModel,
            messages: [{ role: "user", content: promptText }]
          })
        });

        loader.remove();

        if (!response.ok) {
          const errData = await response.json().catch(() => ({}));
          printLine(`API Error (${response.status}): ${errData.error?.message || 'Failed request'}`, 'error');
          return;
        }

        const data = await response.json();
        const reply = data.choices?.[0]?.message?.content || '[No response]';
        printLine(reply, 'bot');

      } catch (err) {
        loader.remove();
        printLine(`Connection Error: ${err.message}`, 'error');
      }
    }
  </script>
</body>
</html>
