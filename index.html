<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nerolinkxz UI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0f12;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 15px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid #1f2937;
    }

    h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }

    .key-bar { display: flex; gap: 8px; }

    input, select, button {
      background: #161b22;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: inherit;
    }

    input:focus, select:focus { outline: 1px solid #00ffcc; }

    button {
      cursor: pointer;
      background: #21262d;
      color: #00ffcc;
      border-color: #30363d;
      transition: 0.2s;
    }

    button:hover { background: #30363d; }

    /* Main Grid Layout */
    .main-container {
      display: flex;
      flex: 1;
      gap: 15px;
      margin: 15px 0;
      overflow: hidden;
    }

    /* Terminal Section */
    #terminal-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #050508;
      border: 1px solid #161b22;
      border-radius: 4px;
      padding: 10px;
    }

    #terminal {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .line { line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
    .user { color: #58a6ff; }
    .bot { color: #7ee787; }
    .sys { color: #8b949e; font-style: italic; }
    .error { color: #f85149; }

    /* Game Hub Section */
    #game-hub {
      flex: 1.2;
      display: flex;
      flex-direction: column;
      background: #050508;
      border: 1px solid #161b22;
      border-radius: 4px;
      padding: 10px;
      gap: 10px;
    }

    .game-controls {
      display: flex;
      gap: 8px;
    }

    .game-controls select { flex: 1; }

    iframe {
      width: 100%;
      flex: 1;
      border: 1px solid #30363d;
      border-radius: 4px;
      background: #000;
    }

    .input-bar { display: flex; gap: 10px; }
    .input-bar input { flex: 1; }

    @media (max-width: 900px) {
      .main-container { flex-direction: column; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Nerolinkxz</h1>
    <div class="key-bar">
      <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key..." />
      <button onclick="saveApiKey()">SAVE</button>
    </div>
  </header>

  <div class="main-container">
    <!-- Terminal -->
    <div id="terminal-container">
      <div id="terminal"></div>
    </div>

    <!-- Embedded Game Hub -->
    <div id="game-hub">
      <div class="game-controls">
        <select id="gameSelect" onchange="loadGame()">
          <option value="">-- Select Game Site / Emulator --</option>
          <option value="https://emulatoros.github.io/">EmulatorOS (Retro Games)</option>
          <option value="https://eaglercraft.com/">Eaglercraft (Minecraft Web)</option>
          <option value="https://slopegame.io/">Slope Game</option>

          <option value="https://slowly.dev/apps/retro-games/">Retro Arcade Portal</option>
          <option value="https://www.retrogames.cc/">RetroGames.cc</option>
          <option value="https://dustinbrett.com/">daedalOS (Web OS & Games)</option>
        </select>
        <button onclick="toggleFullscreen()">FULLSCREEN</button>
      </div>
      <iframe id="gameFrame" src="about:blank" allowfullscreen></iframe>
    </div>
  </div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Type prompt here... (or type /clear)" onkeydown="if(event.key==='Enter') handleSend()" />
    <button onclick="handleSend()">SEND</button>
  </div>

  <script>
    const HARDCODED_API_KEY = "AQ.Ab8RN6Lp6SrEq_evKhhTkeOeX2bJizc-750yPdKCuwtWIVFI6w";
    const terminal = document.getElementById('terminal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const userInput = document.getElementById('userInput');
    const gameFrame = document.getElementById('gameFrame');

    // Auto-load API key on startup
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('nerolinkxz_key');
      if (savedKey) {
        apiKeyInput.value = savedKey;
        printLine('[NEROLINKXZ CORE ENGINE ONLINE]', 'sys');
        printLine('Loaded API key from storage.', 'sys');
      } else {
        apiKeyInput.value = HARDCODED_API_KEY;
        printLine('[NEROLINKXZ CORE ENGINE ONLINE]', 'sys');
        printLine('Target Model: gemini-3.6-flash', 'sys');
      }
    });

    function saveApiKey() {
      const key = apiKeyInput.value.trim();
      if (key) {
        localStorage.setItem('nerolinkxz_key', key);
        printLine('API key saved successfully!', 'sys');
      } else {
        localStorage.removeItem('nerolinkxz_key');
        printLine('API key cleared from storage.', 'sys');
      }
    }

    function printLine(text, type = 'sys') {
      const el = document.createElement('div');
      el.className = `line ${type}`;
      el.innerText = text;
      terminal.appendChild(el);
      terminal.scrollTop = terminal.scrollHeight;
      return el;
    }

    function loadGame() {
      const url = document.getElementById('gameSelect').value;
      if (url) {
        gameFrame.src = url;
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        gameFrame.requestFullscreen().catch(err => {
          printLine(`Fullscreen error: ${err.message}`, 'error');
        });
      } else {
        document.exitFullscreen();
      }
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      if (text === '/clear') {
        terminal.innerHTML = '';
        userInput.value = '';
        return;
      }

      printLine(`$ ${text}`, 'user');
      userInput.value = '';

      await sendGeminiPrompt(text);
    }

    async function sendGeminiPrompt(promptText) {
      let apiKey = localStorage.getItem('nerolinkxz_key') || apiKeyInput.value.trim() || HARDCODED_API_KEY;
      
      if (!apiKey) {
        printLine('Error: No API key found. Enter key above and click SAVE.', 'error');
        return;
      }

      const loader = printLine('thinking...', 'sys');
      const cleanKey = apiKey.trim().replace(/^["']|["']$/g, '');
      
      // Handle OAuth Bearer token format (AQ...) vs standard API key (AIza...)
      const isOAuthToken = cleanKey.startsWith('AQ');
      
      // Target gemini-3.6-flash endpoint
      const url = isOAuthToken 
        ? `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent`
        : `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${cleanKey}`;

      const headers = { 'Content-Type': 'application/json' };
      
      if (isOAuthToken) {
        headers['Authorization'] = `Bearer ${cleanKey}`;
      }

      const maxRetries = 3;
      let attempt = 0;

      while (attempt < maxRetries) {
        try {
          attempt++;
          if (attempt > 1) {
            loader.innerText = `server busy, retrying (${attempt}/${maxRetries})...`;
            await new Promise(r => setTimeout(r, 2000));
          }

          const res = await fetch(url, {
            method: 'POST',
            headers: headers,
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }]
            })
          });

          // Auto-retry on 503 high demand
          if (res.status === 503 && attempt < maxRetries) {
            continue;
          }

          loader.remove();

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            const errMsg = errData.error?.message || `HTTP ${res.status}`;
            printLine(`API Error (${res.status}): ${errMsg}`, 'error');
            return;
          }

          const data = await res.json();
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '[No response]';
          printLine(reply, 'bot');
          return;

        } catch (err) {
          if (attempt >= maxRetries) {
            loader.remove();
            printLine(`Connection Error: ${err.message}`, 'error');
            return;
          }
        }
      }
    }
  </script>
</body>
</html>
