<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nerolinkxz UI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0f12;
      color: #00ffcc;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      height: 100vh;
      padding: 15px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 15px;
      border-bottom: 1px solid #1f2937;
    }

    h1 { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 1px; }

    .key-bar { display: flex; gap: 8px; }

    input, button {
      background: #161b22;
      border: 1px solid #30363d;
      color: #e6edf3;
      padding: 8px 12px;
      border-radius: 4px;
      font-family: inherit;
    }

    input:focus { outline: 1px solid #00ffcc; }

    button {
      cursor: pointer;
      background: #21262d;
      color: #00ffcc;
      border-color: #30363d;
      transition: 0.2s;
    }

    button:hover { background: #30363d; }

    #terminal {
      flex: 1;
      overflow-y: auto;
      margin: 15px 0;
      padding: 10px;
      background: #050508;
      border: 1px solid #161b22;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .line { line-height: 1.4; word-break: break-word; white-space: pre-wrap; }
    .user { color: #58a6ff; }
    .bot { color: #7ee787; }
    .sys { color: #8b949e; font-style: italic; }
    .error { color: #f85149; }

    .input-bar { display: flex; gap: 10px; }
    .input-bar input { flex: 1; }
  </style>
</head>
<body>

  <header>
    <h1>Nerolinkxz</h1>
    <div class="key-bar">
      <input type="password" id="apiKeyInput" placeholder="Enter Gemini API Key..." />
      <button onclick="saveApiKey()">SAVE</button>
    </div>
  </header>

  <div id="terminal"></div>

  <div class="input-bar">
    <input type="text" id="userInput" placeholder="Type prompt here..." onkeydown="if(event.key==='Enter') handleSend()" />
    <button onclick="handleSend()">SEND</button>
  </div>

  <script>
    const HARDCODED_API_KEY = "YOUR_GEMINI_API_KEY_HERE";
    const terminal = document.getElementById('terminal');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const userInput = document.getElementById('userInput');

    // Auto-load API key on startup
    window.addEventListener('DOMContentLoaded', () => {
      const savedKey = localStorage.getItem('nerolinkxz_key');
      if (savedKey) {
        apiKeyInput.value = savedKey;
        printLine('Loaded API Key from LocalStorage.', 'sys');
      } else {
        printLine('Welcome! Enter your API key above to start.', 'sys');
      }
    });

    function saveApiKey() {
      const key = apiKeyInput.value.trim();
      if (key) {
        localStorage.setItem('nerolinkxz_key', key);
        printLine('API Key saved successfully!', 'sys');
      } else {
        localStorage.removeItem('nerolinkxz_key');
        printLine('API Key cleared.', 'sys');
      }
    }

    function printLine(text, type = 'sys') {
      const el = document.createElement('div');
      el.className = `line ${type}`;
      el.innerText = text;
      terminal.appendChild(el);
      terminal.scrollTop = terminal.scrollHeight;
      return el;
    }

    async function handleSend() {
      const text = userInput.value.trim();
      if (!text) return;

      printLine(`> ${text}`, 'user');
      userInput.value = '';

      await sendGeminiPrompt(text);
    }

    async function sendGeminiPrompt(promptText) {
      let apiKey = localStorage.getItem('nerolinkxz_key') || apiKeyInput.value.trim() || HARDCODED_API_KEY;
      
      if (!apiKey || apiKey === "YOUR_GEMINI_API_KEY_HERE") {
        printLine('Error: Please enter a valid Gemini API key at the top & click SAVE.', 'error');
        return;
      }

      const loader = printLine('thinking...', 'sys');
      const cleanKey = apiKey.trim().replace(/^["']|["']$/g, '');
      
      // Target gemini-3.6-flash model
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${cleanKey}`;

      const maxRetries = 3;
      let attempt = 0;

      while (attempt < maxRetries) {
        try {
          attempt++;
          if (attempt > 1) {
            loader.innerText = `server busy, retrying (${attempt}/${maxRetries})...`;
            await new Promise(r => setTimeout(r, 2000));
          }

          const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              contents: [{ parts: [{ text: promptText }] }]
            })
          });

          // Auto-retry on 503 high demand spikes
          if (res.status === 503 && attempt < maxRetries) {
            continue;
          }

          loader.remove();

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            const errMsg = errData.error?.message || `HTTP ${res.status}`;
            printLine(`API Error (${res.status}): ${errMsg}`, 'error');
            return;
          }

          const data = await res.json();
          const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || '[No response]';
          printLine(reply, 'bot');
          return;

        } catch (err) {
          if (attempt >= maxRetries) {
            loader.remove();
            printLine(`Connection Error: ${err.message}`, 'error');
            return;
          }
        }
      }
    }
  </script>
</body>
</html>
